name: Linux checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      - name: Install build and test dependencies
        run: dnf install -y git cargo rust gcc openssl-devel gtk4-devel clippy rustfmt dbus-daemon opensc nss rpm-build desktop-file-utils util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check publication contents
        run: cargo xtask check-publication
      - name: Rust checks
        run: sh scripts/test_rust_wsl.sh
      - name: Silent startup and tray menu tests
        run: cargo xtask tray-smoke --binary "$HOME/.cache/desktopid-rust-target/debug/desktopid-client"
      - name: Native GTK credentials, cancellation and progress tests
        run: cargo xtask native-ui-smoke --target "$HOME/.cache/desktopid-rust-target"
      - name: PKCS11 interoperability tests
        run: sh scripts/test_pkcs11_wsl.sh
      - name: Firefox NSS registration tests
        run: cargo xtask firefox-nss-smoke --module "$HOME/.cache/desktopid-rust-target/debug/libdesktopid_pkcs11.so" --client "$HOME/.cache/desktopid-rust-target/debug/desktopid-client"
      - name: Build Fedora distribution RPM
        run: |
          sh scripts/build_fedora.sh
          cargo xtask package-rpm --target dist/fedora
      - name: Install, reinstall and remove the RPM in the Fedora container
        run: |
          dnf install -y dist/axia-remotedid-*.x86_64.rpm
          install -m 0755 target/release/axia-devtools /tmp/axia-devtools-lab
          useradd --create-home rpm-test
          runuser -u rpm-test -- /tmp/axia-devtools-lab --root "$PWD" rpm-runtime-smoke
          dnf reinstall -y dist/axia-remotedid-*.x86_64.rpm
          runuser -u rpm-test -- /usr/bin/axia-remotedid --version
          dnf remove -y axia-remotedid
          /tmp/axia-devtools-lab --root "$PWD" rpm-runtime-smoke --check-preserved /home/rpm-test
