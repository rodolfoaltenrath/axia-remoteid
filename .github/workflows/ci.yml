name: Linux checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      - name: Install build and test dependencies
        run: dnf install -y git cargo rust gcc openssl-devel clippy rustfmt python3 python3-cryptography opensc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check publication contents
        run: python3 scripts/check_publication.py
      - name: Python protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: Rust checks
        run: sh scripts/test_rust_wsl.sh
      - name: PKCS11 interoperability tests
        run: sh scripts/test_pkcs11_wsl.sh
