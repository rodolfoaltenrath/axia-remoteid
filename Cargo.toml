[workspace]
members = ["crates/desktopid-client", "crates/desktopid-pkcs11", "crates/axia-desktop", "crates/axia-devtools"]
default-members = ["crates/desktopid-client", "crates/desktopid-pkcs11", "crates/axia-desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0-alpha.3"
license = "Apache-2.0"

[profile.release]
strip = "symbols"
