[package]
name = "axia-desktop"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Axia RemotedID desktop application and browser integration"

[[bin]]
# Retain the installed helper filename used by registered browser modules.
name = "desktopid-client"
path = "src/main.rs"

[dependencies]
desktopid-client = { path = "../desktopid-client" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
gtk = { version = "=0.10.3", package = "gtk4", features = ["v4_4"] }
ksni = { version = "0.3.6", features = ["blocking"] }
libc = "0.2"
libloading = "0.8.9"
openssl = "0.10"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
